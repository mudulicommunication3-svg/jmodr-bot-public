name: JioMart API Diagnostic
on:
  workflow_dispatch:
concurrency:
  group: jiomart_bot
  cancel-in-progress: true
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decrypt sessions
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -f backup/sessions.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in backup/sessions.enc | tar xzf -
            echo "sessions restored: $(ls sessions 2>/dev/null | wc -l)"
          else
            echo "NO session backup found"
          fi
      - name: Probe JioMart APIs (search / sizes / add_items)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          python - <<'PYEOF'
          import json, os, glob, urllib.request, urllib.error, uuid

          UA = "Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Mobile Safari/537.36"
          PIN = "751024"
          files = sorted(glob.glob("sessions/*.json"), key=os.path.getmtime, reverse=True)
          print("session files:", [os.path.basename(f) for f in files])
          if not files:
              print("!! NO SESSIONS - cannot test authed APIs"); raise SystemExit(0)
          state = json.load(open(files[0], encoding="utf-8"))
          cookies = {c["name"]: c["value"] for c in state.get("cookies", []) if c.get("name") and c.get("value")}
          token = ""
          for c in state.get("cookies", []):
              if c.get("name") == "cra_access_token":
                  v = str(c.get("value") or "").strip()
                  if v and not v.startswith("eyJ"):
                      token = v; break
          if not token:
              for origin in state.get("origins", []):
                  if "jiomart.com" in (origin.get("origin") or ""):
                      for item in origin.get("localStorage", []) or []:
                          if item.get("name") in ("token", "access_token", "jwt"):
                              token = str(item.get("value", "")).replace("Bearer ", "").strip('"'); break
          print("token found:", bool(token), "| len:", len(token), "| cookie count:", len(cookies))
          print("cookie names:", sorted(cookies.keys()))
          # Examine cra_access_token in every session file
          cat = cookies.get("cra_access_token", "")
          print("cra_access_token: len =", len(cat), "| starts eyJ (JWT)?", cat.startswith("eyJ"), "| first8:", (cat[:8] + "...") if cat else "EMPTY")
          for f in files:
              try:
                  st = json.load(open(f, encoding="utf-8"))
                  for c in st.get("cookies", []):
                      if c.get("name") == "cra_access_token":
                          v = str(c.get("value") or "").strip()
                          print(f"  {os.path.basename(f)[:34]}: cra len={len(v)} jwt={v.startswith('eyJ')}")
                          break
              except Exception as e:
                  print("  ", f, "err", e)
          vid = str(uuid.uuid4())
          cookie_hdr = "; ".join(f"{k}={v}" for k, v in cookies.items())

          def headers():
              h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*",
                   "Origin": "https://www.jiomart.com", "Referer": "https://www.jiomart.com/cart/bag",
                   "Cookie": cookie_hdr,
                   "pincode": PIN, "x-pincode": PIN, "glo_pincode": PIN, "x-glo-pincode": PIN,
                   "X-Location-Detail": json.dumps({"country": "INDIA", "country_iso_code": "IN", "pincode": PIN}),
                   "X-Geolocation": json.dumps({"polygon_ids": []}),
                   "x-visitor-id": vid, "visitor-id": vid, "X-Visitor-Id": vid,
                   "x-channel": "MOB", "clientId": "mweb"}
              if token: h["Authorization"] = f"Bearer {token}"
              return h

          def call(name, url, data=None):
              try:
                  req = urllib.request.Request(url, headers=headers(),
                      data=json.dumps(data).encode() if data is not None else None,
                      method="POST" if data is not None else "GET")
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read().decode("utf-8", "replace")
                      print(f"\n[{name}] HTTP {r.status}")
                      try:
                          j = json.loads(body)
                          print(f"  keys: {list(j.keys())[:12]}")
                          return j
                      except Exception:
                          print("  body:", body[:250]); return None
              except urllib.error.HTTPError as e:
                  print(f"\n[{name}] HTTP {e.code} :: {e.read()[:300].decode('utf-8','replace')}")
                  return None
              except Exception as e:
                  print(f"\n[{name}] ERROR: {e}"); return None

          # Test EVERY session's token against SIZES API
          slug0 = "amul-mozzarella-cheddar-diced-cheese-blend-200-g-pack-mffmzt-7520225"
          print("\n=== PER-SESSION TOKEN TEST (against sizes API) ===")
          working = None
          for f in files:
              try:
                  st = json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  print(f"  {os.path.basename(f)[:36]}: read err {e}"); continue
              ck = {c["name"]: c["value"] for c in st.get("cookies", []) if c.get("name") and c.get("value")}
              tok = ""
              for c in st.get("cookies", []):
                  if c.get("name") == "cra_access_token":
                      v = str(c.get("value") or "").strip()
                      if v and not v.startswith("eyJ"):
                          tok = v; break
              if not tok:
                  for origin in st.get("origins", []):
                      if "jiomart.com" in (origin.get("origin") or ""):
                          for item in origin.get("localStorage", []) or []:
                              if item.get("name") in ("token", "access_token", "jwt"):
                                  tok = str(item.get("value", "")).replace("Bearer ", "").strip('"'); break
              jwt = str(ck.get("cra_access_token", ""))
              test_auth = tok or (jwt if jwt and jwt.startswith("eyJ") else "")
              ch = "; ".join(f"{k}={v}" for k, v in ck.items())
              h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*",
                   "Origin": "https://www.jiomart.com", "Referer": "https://www.jiomart.com/",
                   "Cookie": ch, "pincode": PIN, "x-pincode": PIN, "glo_pincode": PIN,
                   "x-visitor-id": vid, "visitor-id": vid, "x-channel": "MOB", "clientId": "mweb"}
              if test_auth: h["Authorization"] = f"Bearer {test_auth}"
              status, body = "?", ""
              try:
                  req = urllib.request.Request(f"https://www.jiomart.com/api/service/application/catalog/v2.0/products/{slug0}/sizes", headers=h)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      status = r.status; body = r.read().decode("utf-8", "replace")[:150]
              except urllib.error.HTTPError as e:
                  status = e.code; body = e.read().decode("utf-8", "replace")[:150]
              except Exception as e:
                  body = str(e)[:150]
              print(f"  {os.path.basename(f)[:36]}: token={'base64' if tok and not tok.startswith('eyJ') else ('jwt' if test_auth else 'NONE')} len={len(test_auth)} => HTTP {status} {body}")
              if status == 200 and not working:
                  working = (f, test_auth, ck)
          print(f"\nWORKING SESSION: {working[0] if working else 'NONE - all tokens dead'}")

          # Show which session the bot currently uses (active_key from configs)
          try:
              cfg = json.load(open("bot_database.json", encoding="utf-8"))
              for chat, conf in cfg.items():
                  if isinstance(conf, dict) and conf.get("active_key"):
                      print(f"  ACTIVE for chat {chat}: {conf.get('active_key')}")
          except Exception as e:
              print("  configs read err:", e)

          # 2b) FULL CART TEST with the working session
          if working:
              wf, wtok, wck = working
              print(f"\n=== CART TEST USING WORKING SESSION: {os.path.basename(wf)} ===")
              wch = "; ".join(f"{k}={v}" for k, v in wck.items())
              def wh():
                  h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*",
                       "Origin": "https://www.jiomart.com", "Referer": "https://www.jiomart.com/cart/bag",
                       "Cookie": wch, "pincode": PIN, "x-pincode": PIN, "glo_pincode": PIN,
                       "X-Location-Detail": json.dumps({"country": "INDIA", "country_iso_code": "IN", "pincode": PIN}),
                       "X-Geolocation": json.dumps({"polygon_ids": []}),
                       "x-visitor-id": vid, "visitor-id": vid, "X-Visitor-Id": vid,
                       "x-channel": "MOB", "clientId": "mweb"}
                  if wtok: h["Authorization"] = f"Bearer {wtok}"
                  return h
              # get cart id
              wcart = None
              try:
                  req = urllib.request.Request("https://www.jiomart.com/ext/jmshipmentfee/cart/v1.0/get_cart?area_code=751024&b=true&i=true&journey=quickcommerce", headers=wh())
                  with urllib.request.urlopen(req, timeout=20) as r:
                      gc = json.loads(r.read().decode("utf-8", "replace"))
                      prods = (gc.get("identifiers") or {}).get("products") if isinstance(gc.get("identifiers"), dict) else None
                      print(f"[GET-CART] HTTP {r.status} success={gc.get('success')} cart_id={gc.get('cart_id')} items={len(prods or [])}")
                      wcart = gc.get("cart_id")
              except urllib.error.HTTPError as e:
                  print(f"[GET-CART] HTTP {e.code} :: {e.read()[:200].decode('utf-8','replace')}")
              except Exception as e:
                  print(f"[GET-CART] ERROR: {e}")
              # search with working session
              witems = []
              try:
                  req = urllib.request.Request("https://www.jiomart.com/api/service/application/catalog/v1.0/products?q=amul+taaza+milk&page_size=5&page_no=1", headers=wh())
                  with urllib.request.urlopen(req, timeout=20) as r:
                      jw = json.loads(r.read().decode("utf-8", "replace"))
                      witems = jw.get("items") or []
                      print(f"[SEARCH(working)] HTTP {r.status} items={len(witems)}")
              except Exception as e:
                  print(f"[SEARCH(working)] ERROR: {e}")
              wid = wslug = None; wsize = "OS"; wseller = None
              for w in witems:
                  if w.get("sellable"):
                      wid = w.get("uid"); wslug = w.get("slug"); wseller = w.get("seller_id")
                      wsize = (w.get("sizes") or ["OS"])[0]
                      break
              if not wid and witems:
                  w0 = witems[0]; wid = w0.get("uid"); wslug = w0.get("slug"); wseller = w0.get("seller_id")
                  wsize = (w0.get("sizes") or ["OS"])[0]
              print(f"  test item: uid={wid} size={wsize} seller={wseller}")
              # sizes for that item
              if wslug:
                  try:
                      req = urllib.request.Request(f"https://www.jiomart.com/api/service/application/catalog/v2.0/products/{wslug}/sizes", headers=wh())
                      with urllib.request.urlopen(req, timeout=20) as r:
                          jsz = json.loads(r.read().decode("utf-8", "replace"))
                          szs = jsz.get("sizes") or []
                          print(f"[SIZES(working)] HTTP {r.status} count={len(szs)} sellable={jsz.get('sellable')}")
                          if szs:
                              s0 = szs[0]
                              print(f"  size[0]: {json.dumps(s0)[:400]}")
                              print(f"  sellers: {[x.get('seller_identifiers') or x.get('seller_id') for x in szs[:5]]}")
                              if s0.get("size"): wsize = s0["size"]
                              sid = s0.get("seller_identifiers") or s0.get("seller_id")
                  except Exception as e:
                      print(f"[SIZES(working)] ERROR: {e}")
          # 2c) ADD TO CART with working session
          if working and wid:
              sid_flat = sid[0] if isinstance(sid, list) and sid else sid
              seller_try = [sid_flat, wseller, 1]
              ok = False
              for s_try in dict.fromkeys(seller_try):
                  try:
                      req = urllib.request.Request(
                          f"https://www.jiomart.com/ext/jmshipmentfee/cart/v2.0/add_items?area_code=751024&journey=quickcommerce&id={wcart or 'None'}",
                          headers=wh(),
                          data=json.dumps({"item_id": int(wid), "item_size": str(wsize), "quantity": 1,
                                           "seller_id": int(s_try),
                                           "meta": {"vertical_code": "GROCERIES", "compute_delivery_fee": True},
                                           "extra_meta": {"is_tradein_opted": False}, "journey": "quickcommerce"}).encode(),
                          method="POST")
                      with urllib.request.urlopen(req, timeout=20) as r:
                          ja = json.loads(r.read().decode("utf-8", "replace"))
                          print(f"[ADD(working,s={s_try})] HTTP {r.status} success={ja.get('success')} message={ja.get('message')}")
                          if ja.get("success"): ok = True; break
                  except urllib.error.HTTPError as e:
                      print(f"[ADD(working,s={s_try})] HTTP {e.code} :: {e.read()[:250].decode('utf-8','replace')}")
                  except Exception as e:
                      print(f"[ADD(working,s={s_try})] ERROR: {e}")
              print(f"\n>>> CART ADD VIA WORKING SESSION: {'SUCCESS - cart works when token valid!' if ok else 'STILL FAILING - needs size/seller fixes'}")

          # 1) SEARCH
          j = call("SEARCH", "https://www.jiomart.com/api/service/application/catalog/v1.0/products?q=amul%20mozarella&page_size=3&page_no=1")
          items = (j or {}).get("items") or []
          print(f"  search items: {len(items)}")
          slug = item_id = None
          if items:
              it = items[0]
              slug = it.get("slug")
              item_id = it.get("uid") or (it.get("attributes") or {}).get("item_id")
              print(f"  [0] uid={it.get('uid')} item_code={it.get('item_code')} sku_code={it.get('sku_code')} seller_id={it.get('seller_id')}")
              print(f"      slug={slug}")
              print(f"      sizes={it.get('sizes')} instock_variants={json.dumps(it.get('instock_variants'))[:200]}")
              print(f"      journey={it.get('journey')} store_ids={it.get('store_ids')}")
              print(f"      vertical={(it.get('attributes') or {}).get('vertical-code')}")

          # 2) SIZES (needs token) - try BOTH token types
          if slug:
              js = call("SIZES(no-token)", f"https://www.jiomart.com/api/service/application/catalog/v2.0/products/{slug}/sizes")
              # try with the eyJ JWT anyway
              hdr_jwt = headers()
              hdr_jwt["Authorization"] = f"Bearer {cat or 'x'}"
              try:
                  req = urllib.request.Request(f"https://www.jiomart.com/api/service/application/catalog/v2.0/products/{slug}/sizes", headers=hdr_jwt)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      js2 = json.loads(r.read().decode("utf-8", "replace"))
                      print(f"\n[SIZES(jwt)] HTTP {r.status} keys: {list(js2.keys())[:10]}")
                      szs = js2.get("sizes") or []
                      if szs:
                          print(f"  sizes count: {len(szs)} | size[0]: {json.dumps(szs[0])[:400]}")
                          sids = [x.get("seller_identifiers") or x.get("seller_id") for x in szs[:5]]
                          print(f"  seller_identifiers: {sids}")
                      global_token = cat
              except urllib.error.HTTPError as e:
                  print(f"\n[SIZES(jwt)] HTTP {e.code} :: {e.read()[:200].decode('utf-8','replace')}")
                  global_token = ""
              except Exception as e:
                  print(f"\n[SIZES(jwt)] ERROR: {e}"); global_token = ""

          # 3) ADD TO CART (real add, harmless - no order placed)
          if item_id:
              payload = {"item_id": int(item_id), "item_size": "OS", "quantity": 1,
                         "seller_id": 1,
                         "meta": {"vertical_code": "GROCERIES", "compute_delivery_fee": True},
                         "extra_meta": {"is_tradein_opted": False}, "journey": "quickcommerce"}
              # with the JWT token in Authorization (if any)
              def call2(name, url, data, auth):
                  h = headers()
                  if auth:
                      h["Authorization"] = f"Bearer {auth}"
                  try:
                      req = urllib.request.Request(url, headers=h, data=json.dumps(data).encode(), method="POST")
                      with urllib.request.urlopen(req, timeout=20) as r:
                          j = json.loads(r.read().decode("utf-8", "replace"))
                          print(f"\n[{name}] HTTP {r.status} success={j.get('success')} message={j.get('message')} cart_id={j.get('cart_id')}")
                          print(f"  full: {json.dumps(j)[:500]}")
                          return j
                  except urllib.error.HTTPError as e:
                      print(f"\n[{name}] HTTP {e.code} :: {e.read()[:300].decode('utf-8','replace')}")
                  except Exception as e:
                      print(f"\n[{name}] ERROR: {e}")
                  return None
              auth = cat if (cat and not cat.startswith("eyJ") ) else cat
              call2("ADD(jwt,QC)", "https://www.jiomart.com/ext/jmshipmentfee/cart/v2.0/add_items?area_code=751024&journey=quickcommerce&id=None", payload, cat)
              p2 = dict(payload); p2.pop("journey", None)
              call2("ADD(jwt,noJ)", "https://www.jiomart.com/ext/jmshipmentfee/cart/v2.0/add_items?area_code=751024&id=None", p2, cat)
          print("\n=== DIAGNOSTIC COMPLETE ===")
          PYEOF
